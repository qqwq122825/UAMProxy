name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: python -m pip install --upgrade pyinstaller PySide6 pycryptodome

      - name: Run project packaging script
        run: python build_slim.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UAMProxy-Windows
          path: |
            dist/UAMProxy_v*.exe
            dist/UAMProxy_v*.build.json
          if-no-files-found: error
