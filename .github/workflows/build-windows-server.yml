name: Build UAMProxy Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-server-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: "requirements-build.txt"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run 01 replay regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build slim server executable
        shell: pwsh
        run: python build_slim.py

      - name: Generate SHA256
        id: package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "UAMProxy_v*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            throw "dist 中没有找到 UAMProxy_v*.exe"
          }

          $shaFile = "$($exe.FullName).sha256"
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -Path $shaFile -Encoding ascii

          "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sha_path=$shaFile" >> $env:GITHUB_OUTPUT
          "artifact_name=$($exe.BaseName)-windows-x64" >> $env:GITHUB_OUTPUT

          Write-Host "EXE: $($exe.FullName)"
          Write-Host "SHA256: $hash"

      - name: Upload Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.exe_path }}
            ${{ steps.package.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for tag
        if: always() && startsWith(github.ref, 'refs/tags/v') && steps.package.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXE_PATH: ${{ steps.package.outputs.exe_path }}
          SHA_PATH: ${{ steps.package.outputs.sha_path }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:EXE_PATH $env:SHA_PATH --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:EXE_PATH $env:SHA_PATH `
              --title "UAMProxy $env:RELEASE_TAG" `
              --generate-notes
          }
