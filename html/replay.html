<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>小马宝莉</title>
  <style>
    :root {
      --bg: #f3e5f5;
      --panel: rgba(248, 240, 255, 0.85);
      --line: rgba(216, 191, 216, 0.8);
      --text: #4b0082;
      --sub: #9370db;
      --ok: #8a2be2;
      --info: #00ced1;
      --block: #ff69b4;
      --card-bg: rgba(230, 230, 250, 0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 15%, rgba(221, 160, 221, 0.5) 0%, transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(176, 224, 230, 0.5) 0%, transparent 50%),
        var(--bg);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .wrap {
      width: min(940px, 92vw);
      max-height: 100vh;
      max-height: 100dvh;
      border: 2px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(138, 43, 226, 0.2);
      overflow: hidden;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 2px dashed var(--line);
      background: rgba(216, 191, 216, 0.5);
      font-size: 13px;
      letter-spacing: 0.05em;
      color: #8a2be2;
      font-weight: bold;
    }
    .brand { font-size: 18px; font-weight: 900; color: #9400d3; }
    .body {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .left, .right { padding: 24px; }
    .left { border-right: 2px dashed var(--line); }
    .banner {
      font-size: clamp(24px, 4.6vw, 36px);
      color: #9370db;
      text-shadow: 2px 2px 4px rgba(147, 112, 219, 0.3);
      margin-bottom: 12px;
      font-weight: 900;
    }
    .desc {
      font-size: 14px;
      color: #7b68ee;
      margin-bottom: 16px;
      line-height: 1.6;
      font-weight: bold;
    }
    .log {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      min-height: 230px;
      max-height: 280px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.7;
      background: rgba(255, 255, 255, 0.7);
      font-family: "Consolas", monospace;
    }
    .log .exec { color: #00ced1; font-weight: bold; }
    .log .ok { color: var(--ok); font-weight: bold; }
    .log .info { color: var(--info); font-weight: bold; }
    .log .block { color: var(--block); font-weight: bold; }
    .card {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      background: var(--card-bg);
      margin-bottom: 12px;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.02); }
    .k { font-size: 13px; color: #8a2be2; text-transform: uppercase; font-weight: bold; }
    .v { margin-top: 6px; font-size: 15px; color: #4b0082; word-break: break-all; font-weight: 900; }
    .cursor {
      display: inline-block;
      width: 0.8ch;
      height: 1.2em;
      margin-left: 2px;
      vertical-align: -0.15em;
      background: #8a2be2;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(138, 43, 226, 0.6);
      animation: blink 1s steps(1, end) infinite;
    }
    .boot {
      min-height: 230px;
      display: grid;
      place-items: center;
      color: #9370db;
      text-shadow: 0 0 10px rgba(147, 112, 219, 0.5);
    }
    .boot pre { font-size: 16px; line-height: 1.1; margin: 0; font-family: monospace; }
    .boot .label { margin-top: 10px; font-size: 14px; text-align: center; color: #8a2be2; font-weight: bold; }
    @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
    @media (max-width: 860px) {
      body { padding: 8px 0; align-items: flex-start; }
      .wrap { max-height: none; margin: 0 auto; }
      .body { grid-template-columns: 1fr; }
      .right { display: flex; flex-direction: column; }
      .left { border-right: none; border-bottom: 2px dashed var(--line); }
      .left, .right { padding: 12px 16px; }
      .banner { font-size: clamp(18px, 4vw, 24px); margin-bottom: 8px; }
      .desc { font-size: 12px; margin-bottom: 10px; }
      .log { min-height: 120px; max-height: 160px; padding: 10px; font-size: 12px; }
      .card { padding: 8px 12px; margin-bottom: 8px; }
      .card .k { font-size: 11px; }
      .card .v { font-size: 13px; margin-top: 4px; }
      .topbar { padding: 8px 12px; font-size: 11px; flex-wrap: wrap; gap: 4px; }
      .brand { font-size: 14px; }
      .boot { min-height: 100px; }
      .boot pre { font-size: 12px; }
      .boot .label { font-size: 12px; margin-top: 6px; }
      .verify-card { order: -1; background: rgba(138, 43, 226, 0.15); border-color: var(--ok); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="brand">✨ 小马宝莉 ✨</div>
      <div>🌟 REPLAY CHANNEL / PORT <span id="topPortText">{{PORT}}</span> 🌟</div>
    </div>
    <section class="body">
      <article class="left">
        <h1 class="banner">🦄 REPLAY PORT CONNECTED 🦄</h1>
        <p class="desc">重放链路已上线，系统将执行解码启动和回放通道检测。</p>
        <div id="logText" class="log"></div>
      </article>
      <aside class="right">
        <div class="card"><div class="k">User</div><div id="userText" class="v">{{USERNAME}}</div></div>
        <div class="card"><div class="k">Expire</div><div id="expireText" class="v">{{EXPIRE}}</div></div>
        <div class="card"><div class="k">Port</div><div id="portText" class="v">{{PORT}}</div></div>
        <div class="card"><div class="k">Session Time</div><div id="timeText" class="v">-</div></div>
        <div class="card verify-card"><div class="k">校验码 Verify Token</div><div id="verifyText" class="v">-</div></div>
      </aside>
    </section>
  </main>

  <script>
    (function init() {
      var params = new URLSearchParams(location.search);
      var portEl = document.getElementById("portText");
      var port = portEl.textContent.trim();
      var topPortEl = document.getElementById("topPortText");
      if (topPortEl) topPortEl.textContent = port;
      var verify = makeVerify();
      var logEl = document.getElementById("logText");
      document.getElementById("timeText").textContent = new Date().toLocaleString("zh-CN", { hour12: false });
      document.getElementById("verifyText").textContent = verify;
      showBoot(logEl);

      params.set("v", verify);
      history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash);

      setTimeout(function () {
        runFlow(logEl, port);
      }, 420);
    })();

    function showBoot(logEl) {
      var horse = [
        "    /)_/)    ",
        "   ( ^ . ^ ) ",
        "  ~(   O   )~",
        "    \\_   _/  ",
        "      UU     "
      ].join("\n");
      logEl.innerHTML = "<div class='boot'><div><pre>" + horse + "</pre><div class='label'>💜 小马宝莉 REPLAY BOOTING 💜<span class='cursor'></span></div></div></div>";
    }

    function runFlow(logEl, port) {
      var queue = [
        "[SUCCESS] Login SUCCESS / 登录成功",
        "[EXEC] replay engine bootstrap sequence",
        "[INFO] Replay module starting...",
        "[INFO] Timeline cache initializing...",
        "[SUCCESS] Replay module startup SUCCESS / 重放模块启动成功",
        "[EXEC] playback secure channel binding",
        "[INFO] Replay tunnel establishing...",
        "[SUCCESS] Replay tunnel startup SUCCESS / 重放隧道启动成功",
        "[SUCCESS] 重放安全端口已就绪，开始回放"
      ];
      streamTyping(logEl, queue, 5000);
    }

    function streamTyping(logEl, queue, minStayMs) {
      var lines = [];
      var current = "";
      var cursor = 0;
      var dotStep = 0;
      var dotTick = 0;
      var stutterFrames = 0;
      var stutterDone = false;
      var startedAt = Date.now();
      var done = false;

      var timer = setInterval(function () {
        dotTick++;
        if (dotTick % 8 === 0) dotStep++;
        if (!current && queue.length > 0) {
          current = queue.shift();
          cursor = 0;
          stutterFrames = 0;
          stutterDone = false;
        }
        if (current) {
          if (!stutterDone && /starting|initializing|establishing/i.test(current) && cursor > current.length * 0.65) {
            stutterDone = true;
            stutterFrames = 10 + Math.floor(Math.random() * 8);
          }
          if (stutterFrames > 0) {
            stutterFrames--;
            render(logEl, lines, applyDots(current, dotStep), false);
            return;
          }
          cursor = Math.min(current.length, cursor + (6 + Math.floor(Math.random() * 4)));
          var partial = current.slice(0, cursor);
          var loading = /starting|initializing|establishing/i.test(current);
          render(logEl, lines, applyDots(partial, dotStep), !loading);
          if (cursor >= current.length) {
            lines.push(current.replace(/\.{1,3}$/, "..."));
            current = "";
          }
        } else {
          render(logEl, lines, "", true);
          if (!done && queue.length === 0 && Date.now() - startedAt >= minStayMs) {
            done = true;
            clearInterval(timer);
          }
        }
        logEl.scrollTop = logEl.scrollHeight;
      }, 24);
    }

    function applyDots(line, step) {
      if (!line || !/starting|initializing|establishing/i.test(line)) return line;
      return line.replace(/\.{3}/g, ".".repeat((step % 3) + 1));
    }

    function render(logEl, lines, current, showCursor) {
      var out = lines.slice();
      if (current) out.push(colorize(current));
      else out = out.map(colorize);
      var html = out.join("\n");
      if (showCursor !== false) html += "<span class='cursor'></span>";
      logEl.innerHTML = html;
    }

    function colorize(line) {
      if (line.indexOf("[EXEC]") === 0) return "<span class='exec'>" + line + "</span>";
      if (line.indexOf("[SUCCESS]") === 0) return "<span class='ok'>" + line + "</span>";
      if (line.indexOf("[INFO]") === 0) return "<span class='info'>" + line + "</span>";
      if (line.indexOf("[BLOCK]") === 0) return "<span class='block'>" + line + "</span>";
      return line;
    }

    function makeVerify() {
      var bytes = new Uint8Array(8);
      if (crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
      else for (var i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
      var rand = "";
      for (var j = 0; j < bytes.length; j++) rand += bytes[j].toString(16).padStart(2, "0");
      return ("RP-" + Date.now().toString(36) + "-" + rand).toUpperCase();
    }
  </script>
</body>
</html>
